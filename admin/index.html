<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SilverSync AI | Private CRM</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#eaf4ff;background:#080f20}*{box-sizing:border-box}body{margin:0}header{padding:22px max(20px,calc((100vw - 1160px)/2));border-bottom:1px solid #263653;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:24px;margin:0}header span{color:#31c7f5}main{max-width:1160px;margin:30px auto;padding:0 20px}.sub{color:#9eb0c8}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:25px 0}.stat,.panel{border:1px solid #273a5a;background:#101c34;border-radius:14px;padding:20px}.stat strong{display:block;font-size:34px;margin-top:8px}.filters{display:flex;gap:12px;margin:15px 0;flex-wrap:wrap}input,select,button{font:inherit;border-radius:9px;padding:10px 12px}input,select{background:#101c34;color:#f1f6ff;border:1px solid #35486a}input{min-width:250px;flex:1}button,.action{background:#15b9eb;color:#071527;border:0;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.action{padding:8px 10px;border-radius:8px}button:disabled{opacity:.5;cursor:wait}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:14px 10px;text-align:left;border-bottom:1px solid #263653;vertical-align:top;font-size:13px}th{color:#a7b9d1}td{overflow-wrap:anywhere;max-width:220px}td select{font-size:12px;max-width:150px}.muted{color:#a7b9d1}.error{color:#ffb4b4}.pagination{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:15px}a{color:#4dd5ff}@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:18px 20px}}
</style></head><body><header><h1><span>SSAi</span> SilverSync AI CRM</h1><a href="/">Public website</a></header><main><h2>Lead management</h2><p class="sub">Private customer enquiries · Cloudflare D1</p><section class="stats"><div class="stat">Total leads<strong id="total">—</strong></div><div class="stat">New<strong id="new">—</strong></div><div class="stat">Contacted<strong id="contacted">—</strong></div><div class="stat">Won<strong id="won">—</strong></div></section><div class="filters"><input id="search" placeholder="Search business, contact, phone or email" aria-label="Search leads"><select id="filter" aria-label="Filter by status"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>Qualified</option><option>Proposal Sent</option><option>Won</option><option>Lost</option></select><button id="refresh">Refresh</button></div><p id="notice" role="status" class="muted">Loading leads…</p><section class="panel tablewrap"><table><thead><tr><th>Business / contact</th><th>Contact</th><th>Services / message</th><th>Created (UTC)</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><div class="pagination"><button id="prev">Previous</button><span id="page">Page 1</span><button id="next">Next</button></div></section></main><script>
const statuses=['New','Contacted','Qualified','Proposal Sent','Won','Lost'];const $=id=>document.getElementById(id);let page=1,total=0,loading=false;const fmt=s=>s?String(s).replace(' ','T').replace(/Z$/,''):'—';
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
async function load(){if(loading)return;loading=true;$('notice').textContent='Loading leads…';$('refresh').disabled=true;try{const p=new URLSearchParams({page:String(page)});if($('search').value.trim())p.set('q',$('search').value.trim());if($('filter').value)p.set('status',$('filter').value);const r=await fetch('/admin/api/leads?'+p,{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Access authentication failed. Check Access policy and JWT settings.':`Unable to load leads (HTTP ${r.status}).`);const data=await r.json();total=data.total;$('total').textContent=(data.stats||[]).reduce((s,x)=>s+Number(x.count),0);for(const s of ['New','Contacted','Won'])$(s.toLowerCase()).textContent=(data.stats||[]).find(x=>x.status===s)?.count||0;$('rows').replaceChildren();for(const lead of data.leads){const tr=document.createElement('tr');const a=el('td');a.append(el('strong',lead.business_name),el('div',lead.contact_name,'muted'));tr.append(a);const contact=el('td');contact.append(el('div',lead.phone));if(lead.email){const mail=el('a',lead.email);mail.href='mailto:'+lead.email;contact.append(mail);}tr.append(contact);const info=el('td');info.append(el('div',lead.service),el('p',lead.message||'','muted'));tr.append(info,el('td',fmt(lead.created_at)));const status=el('td'),select=document.createElement('select');for(const value of statuses){const option=el('option',value);option.value=value;select.append(option);}select.value=lead.status||'New';select.addEventListener('change',async()=>{select.disabled=true;try{const r=await fetch('/admin/api/leads/'+lead.id,{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:select.value})});if(!r.ok)throw Error('Could not update status');await load();}catch(e){alert(e.message);select.value=lead.status;}finally{select.disabled=false;}});status.append(select);tr.append(status);const action=el('td');const digits=(lead.phone||'').replace(/\D/g,'');if(digits){const link=el('a','WhatsApp','action');link.href='https://wa.me/'+digits;link.target='_blank';link.rel='noopener noreferrer';action.append(link);}tr.append(action);$('rows').append(tr);}if(!data.leads.length)$('rows').append(el('tr')).firstChild.append(Object.assign(el('td','No leads found.'),{colSpan:6}));$('page').textContent=`Page ${page} · ${total} matching`;$('prev').disabled=page<=1;$('next').disabled=page*data.pageSize>=total;$('notice').textContent='Showing '+data.leads.length+' lead(s).';}catch(e){$('notice').textContent=e.message;$('notice').className='error';}finally{loading=false;$('refresh').disabled=false;}}
let timer;$('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load()},350)});$('filter').addEventListener('change',()=>{page=1;load()});$('refresh').onclick=load;$('prev').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};load();
</script></body></html>
